name: CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: 🔧빌드
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 테스트(H2 메모리 DB)까지 돌린 뒤 실행용 jar를 만든다
      - name: Build with Gradle
        run: ./gradlew build

      # DockerHub 로그인
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build and Push Docker image
        run: |
          cd .github/docker
          docker compose -f compose.build.yml build
          docker compose -f compose.build.yml push

  server:
    name: 🚀배포
    runs-on: ubuntu-latest
    needs: build
    steps:
      # 단일 컨테이너 중단 배포: 새 이미지를 받고, 기존 컨테이너를 내린 뒤 새로 띄운다.
      # 실행 설정(포트, 네트워크, .env, 볼륨)은 서버의 docker compose 파일을 그대로 쓴다.
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/trendist/trendist-back
            # 서버에 compose v2 플러그인이 없으면 docker-compose(v1)를 쓴다
            if docker compose version >/dev/null 2>&1; then DC="docker compose"; else DC="docker-compose"; fi
            $DC pull trendist-back
            $DC stop trendist-back
            $DC rm -f trendist-back
            $DC up -d trendist-back
            # nginx upstream(trendist-back:4001)이 새 컨테이너 주소를 다시 읽게 한다
            docker exec nginx nginx -s reload
            docker image prune -f
