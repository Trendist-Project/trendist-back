# 로컬 개발(기본 프로필). DB 값은 git에 올리지 않는 src/main/resources/application.env에 적는다.
spring:
  config:
    import: optional:file:./src/main/resources/application.env[.properties]

  # 개발 DB: 개발용 서버의 MySQL(원격), DB 이름 trendist_dev
  datasource:
    url: ${DEV_MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

  # JPA 설정
  jpa:
    show-sql: false    # Hibernate 가 생성하는 SQL 쿼리를 콘솔에 출력
    properties:
      hibernate:
        format_sql: true    # SQL 쿼리를 보기 쉽게 포맷팅하여 출력합니다.
        use_sql_comments: true    # SQL 쿼리에 주석을 추가
        highlight_sql: true   # SQL 쿼리를 하이라이트하여 출력
    hibernate:
      # 스키마는 Flyway가 바꾼다. 엔티티와 DB가 다르면(마이그레이션을 빠뜨리면) 시작할 때 오류로 알려 준다
      ddl-auto: validate

  flyway:
    enabled: true

# 키워드 AI 한 줄 설명용 제미나이 API 키(로컬, 4.12). 없으면 기능이 꺼진다
trendist:
  gemini:
    api-key: ${DEV_GEMINI_API_KEY:}
