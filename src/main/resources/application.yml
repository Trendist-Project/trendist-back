spring:
  application:
    name: trendist
  # 프로필을 따로 주지 않으면 개발(dev)로 뜬다. 운영 컨테이너는 -Dspring.profiles.active=prod
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false

server:
  # 로컬 개발에서는 프론트 개발 서버(http://localhost:8080)가 /api, /ws를 이 포트로 넘긴다. 운영 포트는 application-prod.yml
  port: ${SERVER_PORT:8081}

trendist:
  jwt:
    # 개발용 기본값. 운영에서는 반드시 환경 변수 TRENDIST_JWT_SECRET(32바이트 이상)로 바꾼다.
    secret: ${TRENDIST_JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    access-ttl-minutes: 15
  cookie:
    secure: false
  # 구글 로그인(9.3). 클라이언트 ID는 공개 값이다. 브라우저가 받은 ID 토큰을 서버가 구글 공개 키로 검증만 하므로 보안 비밀번호는 쓰지 않는다
  google:
    client-id: ${TRENDIST_GOOGLE_CLIENT_ID:754902354311-cmqprte41plivrf720bonpsdo6eh2m8i.apps.googleusercontent.com}
  ws:
    allowed-origins: http://localhost:8080,http://127.0.0.1:8080
  # 구글 트렌드 실시간 인기 RSS를 5분마다 읽어 키워드로 넣는다(10.2). 자동 테스트에서는 끈다.
  google-trends:
    enabled: true
  # 로컬 개발·테스트용 외부 키워드. 이 목록의 키워드는 구글 실시간 인기에 오른 것처럼(반영 소스 google) 본다.
  dev-trends:
    enabled: true
    # "키워드:관심도" 형식
    keywords:
      - "양쯔깐루:82"
      - "두바이쫀득쿠키:64"
      - "탕후루:35"
      - "케이팝:70"
      - "말차라떼:41"
