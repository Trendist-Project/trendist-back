spring:
  application:
    name: trendist
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false

server:
  # 로컬 개발에서는 프론트 개발 서버(http://localhost:8080)가 /api, /ws를 이 포트로 넘긴다
  port: ${SERVER_PORT:8081}

trendist:
  jwt:
    # 개발용 기본값. 운영에서는 반드시 환경 변수 TRENDIST_JWT_SECRET(32바이트 이상)로 바꾼다.
    secret: ${TRENDIST_JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    access-ttl-minutes: 15
  cookie:
    secure: false
  # 구글 로그인(9.3). 클라이언트 ID는 공개 값이다. 브라우저가 받은 ID 토큰을 서버가 구글 공개 키로 검증만 하므로 보안 비밀번호는 쓰지 않는다
  google:
    client-id: ${TRENDIST_GOOGLE_CLIENT_ID:241731311282-45is2ai9skpf33gmgljlv423r1f2j2vt.apps.googleusercontent.com}
  ws:
    allowed-origins: http://localhost:8080,http://127.0.0.1:8080
  # 구글 트렌드 실시간 인기 RSS를 5분마다 읽어 키워드로 넣는다(10.2). 자동 테스트에서는 끈다.
  google-trends:
    enabled: true
  # 외부 트렌드 소스(네이버 데이터랩)를 붙이기 전까지 쓰는 개발용 값. 이 목록의 키워드는 외부 관심도가 있는 것으로 본다.
  dev-trends:
    enabled: true
    # "키워드:관심도" 형식
    keywords:
      - "양쯔깐루:82"
      - "두바이쫀득쿠키:64"
      - "탕후루:35"
      - "케이팝:70"
      - "말차라떼:41"

---
spring:
  config:
    activate:
      on-profile: local
  # 로컬 개발 DB: 이 PC(우분투)의 MariaDB, DB 이름 trendist.
  # 비밀번호는 git에 올리지 않는 config/application-local.yml(또는 환경 변수 TRENDIST_DB_PASSWORD)에 둔다.
  datasource:
    url: ${TRENDIST_DB_URL:jdbc:mariadb://localhost:3306/trendist}
    username: ${TRENDIST_DB_USER:trendist}
    password: ${TRENDIST_DB_PASSWORD:}

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${TRENDIST_DB_URL:jdbc:mysql://localhost:3306/trendist?serverTimezone=UTC&characterEncoding=UTF-8&rewriteBatchedStatements=true}
    username: ${TRENDIST_DB_USER:trendist}
    password: ${TRENDIST_DB_PASSWORD:}

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
trendist:
  cookie:
    secure: true
  dev-trends:
    enabled: false
