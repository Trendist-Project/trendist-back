# 운영. 값은 서버 docker compose의 env_file(../.env)과 environment로 받는다.
server:
  # nginx upstream trendist-back:4001
  port: ${PROD_SERVER_PORT}
  # nginx가 넣는 X-Forwarded-For로 실제 접속 IP를 읽는다(자랑하기 카드 조회 수의 방문자 구분, 4.24)
  forward-headers-strategy: native

spring:
  datasource:
    url: ${PROD_MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

  # JPA 설정
  jpa:
    open-in-view: false
    show-sql: false    # Hibernate 가 생성하는 SQL 쿼리를 콘솔에 출력
    hibernate:
      ddl-auto: update # Flyway 전환 전까지 update(16.1)

trendist:
  cookie:
    secure: true
  # 키워드 AI 한 줄 설명용 제미나이 API 키(운영, 4.12)
  gemini:
    api-key: ${PROD_GEMINI_API_KEY:}
  # 게임 WebSocket을 열 수 있는 사이트 주소(쉼표로 여러 개). 기본값은 운영 도메인
  ws:
    allowed-origins: ${PROD_ALLOWED_ORIGINS:https://trendist.kr,https://www.trendist.kr}
  # 공유 주소·OG 태그에 쓰는 운영 사이트 주소(4.24)
  share:
    base-url: ${PROD_SITE_URL:https://trendist.kr}
  dev-trends:
    enabled: false
